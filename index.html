<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0e14">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Check-in">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Check-in de Convidados</title>
<style>
:root{
  --bg:#0f0e14; --surface:#1a1922; --surface2:#242332; --line:#2e2d3b;
  --text:#f3efe7; --muted:#a29eb0; --gold:#d9b86c; --on-gold:#1d1608;
  --ok:#74d3a0; --ok-bg:rgba(116,211,160,.12); --ok-line:rgba(116,211,160,.45); --on-ok:#0b1f15;
  --danger:#ef8372; --on-danger:#1c0a07; --glow:rgba(217,184,108,.14); --ring:rgba(217,184,108,.25);
  --shadow:0 14px 40px rgba(0,0,0,.5);
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --gx:16px;
}
[data-theme=light]{
  --bg:#f5f1e8; --surface:#ffffff; --surface2:#f1ebdd; --line:#e1dac9;
  --text:#1e1b24; --muted:#6a6578; --gold:#8f6a17; --on-gold:#ffffff;
  --ok:#1f8a58; --ok-bg:rgba(31,138,88,.09); --ok-line:rgba(31,138,88,.4); --on-ok:#ffffff;
  --danger:#c4432f; --on-danger:#ffffff; --glow:rgba(143,106,23,.10); --ring:rgba(143,106,23,.22);
  --shadow:0 14px 40px rgba(60,45,10,.16);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 var(--sans);-webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- layout ---------- */
.app{display:grid;height:100vh;height:100dvh;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"head" "side" "main"}
.head{grid-area:head;display:flex;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) calc(var(--gx) + env(safe-area-inset-right)) 12px calc(var(--gx) + env(safe-area-inset-left));
  border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--glow),transparent 120%)}
.brand{flex:1;min-width:0}
.eyebrow{display:block;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
.brand h1{margin:1px 0 0;font:600 1.3rem/1.2 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.8rem;text-transform:capitalize}
.side{grid-area:side;display:grid;gap:10px;padding:12px calc(var(--gx) + env(safe-area-inset-right)) 4px calc(var(--gx) + env(safe-area-inset-left))}
.main{grid-area:main;display:flex;flex-direction:column;min-height:0;min-width:0;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;transition:background .15s,border-color .15s,transform .08s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:var(--on-danger)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:0 14px;font-size:.9rem;border-radius:10px}
.btn svg{flex:none}
.iconbtn{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:focus-visible,.iconbtn:focus-visible,.chip:focus-visible,.row:focus-visible,.seg button:focus-visible,.ibtn:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-color:var(--gold)}
@media (hover:hover){.btn:hover,.iconbtn:hover{border-color:var(--gold)}}
#editBtn{min-width:44px;padding:0}
#editBtn span{display:none}
@media (min-width:480px){#editBtn span{display:inline}#editBtn{padding:0 16px}}
body.editing #editBtn{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}

/* ---------- stats ---------- */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.stat-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.big{font:600 2rem/1 var(--serif);font-variant-numeric:tabular-nums}
.of{color:var(--muted);font-size:1.05rem;font-variant-numeric:tabular-nums}
.pct{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--surface2);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--ok));border-radius:99px;transition:width .35s ease}
.stat-cap{margin-top:6px;color:var(--muted);font-size:.78rem}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 4px;border-radius:10px;cursor:pointer;min-height:46px;line-height:1.15;-webkit-tap-highlight-color:transparent}
.seg button b{display:block;color:var(--text);font-size:1.05rem;font-variant-numeric:tabular-nums}
.seg button span{font-size:.74rem}
.seg button[aria-pressed=true]{background:var(--gold);color:var(--on-gold)}
.seg button[aria-pressed=true] b{color:var(--on-gold)}
.recent{display:none}
.recent h3{margin:0 0 8px;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.recent ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.recent li{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:.9rem}
.recent li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent time{color:var(--muted);font-variant-numeric:tabular-nums}
.recent .none{color:var(--muted);font-size:.9rem}

/* ---------- search + letters ---------- */
.search{position:relative;display:flex;align-items:center;flex:none;margin:10px var(--gx) 8px}
.search #searchIcon{position:absolute;left:15px;top:50%;transform:translateY(-50%);display:grid;color:var(--muted);pointer-events:none}
.search input{width:100%;height:54px;padding:0 50px 0 48px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:1.05rem;outline:none;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{display:none}
.search input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--ring)}
.search input::placeholder{color:var(--muted)}
.search .clear{position:absolute;right:6px;width:42px;height:42px;border:0;border-radius:12px;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.alpha{display:flex;flex:none;gap:6px;padding:2px var(--gx) 10px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.alpha::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:42px;height:42px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;-webkit-tap-highlight-color:transparent}
.chip.wide{padding:0 16px}
.chip[disabled]{opacity:.28;cursor:default}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
@media (hover:hover){.chip:not([disabled]):hover{border-color:var(--gold)}}

/* ---------- edit bar ---------- */
.editbar{flex:none;margin:10px var(--gx) 0;padding:12px 14px;border-radius:16px;border:1px dashed var(--gold);background:var(--glow)}
.eb-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.eb-top div{flex:1;min-width:180px}
.eb-top strong{display:block;color:var(--gold)}
.eb-top small{color:var(--muted)}
.eb-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* ---------- list ---------- */
.scroller{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.letter{position:sticky;top:0;z-index:2;display:flex;align-items:baseline;gap:10px;margin:0;padding:10px var(--gx) 6px;background:var(--bg);font:600 1.6rem/1 var(--serif);color:var(--gold)}
.letter small{font:500 .75rem var(--sans);color:var(--muted);letter-spacing:.03em}
.rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:8px;padding:2px var(--gx) 10px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:66px;padding:10px 14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s,border-color .15s,transform .08s}
.row:active{transform:scale(.985)}
.nm{flex:1;min-width:0;font-size:1.08rem;font-weight:500;overflow-wrap:anywhere}
.meta{display:block;margin-top:2px;font-size:.78rem;font-weight:400;color:var(--muted)}
.tick{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s,color .15s,transform .2s}
.row.on{background:var(--ok-bg);border-color:var(--ok-line)}
.row.on .tick{background:var(--ok);border-color:var(--ok);color:var(--on-ok);transform:scale(1.04)}
.row.on .meta{color:var(--ok)}
@media (hover:hover){.row:not(.edit):hover{border-color:var(--gold)}}
body.editing .row{border-style:dashed;cursor:default}
body.editing .row:active{transform:none}
.ibtn{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);cursor:pointer}
.ibtn.del{color:var(--danger)}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%,65%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:0 0 0 0 transparent}}
.empty{margin:40px var(--gx);padding:26px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
.empty h3{margin:10px 0 6px;color:var(--text);font:600 1.3rem var(--serif)}
.empty p{margin:0 auto 16px;max-width:36ch}
.empty-mark{display:inline-grid;place-items:center;width:60px;height:60px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--gold)}
.empty-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- dialogs ---------- */
dialog{border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--text);padding:0;width:min(92vw,470px);max-height:90vh;max-height:90dvh;overflow:auto;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(5,4,10,.66);backdrop-filter:blur(3px)}
dialog form{padding:22px;display:grid;gap:14px}
dialog h3{margin:0;font:600 1.3rem/1.2 var(--serif)}
dialog p{margin:0;color:var(--muted)}
.fld{display:grid;gap:6px}
.fld>span{font-size:.82rem;color:var(--muted)}
.fld input,.fld textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;outline:none}
.fld input{height:50px}
.fld textarea{resize:vertical;min-height:140px}
.fld input:focus,.fld textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--ring)}
.err{margin:0;color:var(--danger);font-size:.9rem}
.dlg-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.dlg-actions .btn{flex:1 1 130px}
.or{text-align:center;color:var(--muted);font-size:.82rem}
.filebtn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border:1px dashed var(--line);border-radius:12px;cursor:pointer;color:var(--muted)}
.filebtn input{position:absolute;opacity:0;width:1px;height:1px}
.filebtn:focus-within{border-color:var(--gold)}
.radios{display:grid;gap:8px;border:0;padding:0;margin:0}
.radios label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.radios input{margin-top:3px;accent-color:var(--gold)}
.radios small{display:block;color:var(--muted)}
.help{margin:0;padding-left:18px;color:var(--muted);display:grid;gap:8px}
.help b{color:var(--text)}
.menu-list{display:grid;gap:8px;padding:14px}
.menu-list button{display:flex;align-items:center;gap:12px;min-height:54px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer;text-align:left}
.menu-list button svg{color:var(--gold)}
#menu{width:min(92vw,360px)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:12px;max-width:min(92vw,540px);padding:10px 10px 10px 18px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);transition:opacity .2s,transform .2s;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{min-width:0;overflow-wrap:anywhere}

/* ---------- tablet / desktop ---------- */
@media (min-width:600px){:root{--gx:24px}}
/* duas colunas: tablet/PC e celular deitado */
@media (min-width:900px),(min-width:640px) and (orientation:landscape){
  .app{grid-template-columns:minmax(260px,340px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"head head" "side main"}
  .side{align-content:start;overflow-y:auto;padding-top:16px;padding-bottom:16px;border-right:1px solid var(--line);gap:14px}
}
@media (min-width:900px){
  .app{grid-template-columns:minmax(300px,360px) minmax(0,1fr)}
  .side{padding-top:20px;padding-bottom:20px;gap:18px}
  .big{font-size:2.8rem}
  .recent{display:block}
  .alpha{flex-wrap:wrap;overflow:visible}
  .search{margin-top:16px}
}
@media (min-width:900px) and (max-height:520px){.big{font-size:2rem}.recent{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <div class="brand">
      <span class="eyebrow">Check-in de convidados</span>
      <h1 id="title">Nome do evento</h1>
      <p id="today"></p>
    </div>
    <button class="btn" id="editBtn" type="button" aria-pressed="false"></button>
    <button class="iconbtn" id="menuBtn" type="button" aria-label="Menu"></button>
  </header>

  <section class="side" aria-label="Resumo">
    <div class="stat">
      <div class="stat-top">
        <div><span class="big" id="nPresent">0</span><span class="of"> / <span id="nTotal">0</span></span></div>
        <div class="pct" id="pct">0%</div>
      </div>
      <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
      <div class="stat-cap">presentes confirmados</div>
    </div>
    <div class="seg" id="seg" role="group" aria-label="Filtrar por situação">
      <button type="button" data-status="all" aria-pressed="true"><b id="cAll">0</b><span>Todos</span></button>
      <button type="button" data-status="present" aria-pressed="false"><b id="cPresent">0</b><span>Presentes</span></button>
      <button type="button" data-status="pending" aria-pressed="false"><b id="cPending">0</b><span>Faltam</span></button>
    </div>
    <div class="recent"><h3>Últimos check-ins</h3><ul id="recent"></ul></div>
  </section>

  <main class="main">
    <div class="editbar" id="editbar" hidden>
      <div class="eb-top">
        <div><strong>Modo de edição ativo</strong><small>Bloqueia sozinho após 3 min sem uso.</small></div>
        <button class="btn primary sm" id="doneEdit" type="button">Concluir e bloquear</button>
      </div>
      <div class="eb-tools">
        <button class="btn sm" type="button" data-tool="add">+ Convidado</button>
        <button class="btn sm" type="button" data-tool="import">Importar lista</button>
        <button class="btn sm" type="button" data-tool="title">Nome do evento</button>
        <button class="btn sm" type="button" data-tool="reset">Zerar presenças</button>
        <button class="btn sm danger" type="button" data-tool="wipe">Apagar lista</button>
      </div>
    </div>

    <div class="search">
      <span id="searchIcon"></span>
      <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Buscar por nome ou letra…" aria-label="Buscar convidado">
      <button class="clear" id="qClear" type="button" aria-label="Limpar busca" hidden></button>
    </div>
    <nav class="alpha" id="alpha" aria-label="Filtrar por letra inicial"></nav>
    <div class="scroller" id="scroller"><div id="list"></div></div>
  </main>
</div>

<dialog id="dlg">
  <form id="dlgForm" method="dialog" novalidate>
    <h3 id="dlgTitle"></h3>
    <p id="dlgMsg"></p>
    <div id="dlgBody"></div>
    <p class="err" id="dlgErr" role="alert" hidden></p>
    <div class="dlg-actions">
      <button type="button" class="btn ghost" id="dlgCancel">Cancelar</button>
      <button type="submit" class="btn primary" id="dlgOk">OK</button>
    </div>
  </form>
</dialog>

<dialog id="menu"><div class="menu-list" id="menuList"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ================= helpers ================= */
const KEY = 'checkin-convidados.v1';
const EDIT_TIMEOUT = 3 * 60 * 1000;
const coll = new Intl.Collator('pt-BR', { sensitivity: 'base', numeric: true });
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const hhmm = ts => new Date(ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const letterOf = k => { const c = k.charAt(0).toUpperCase(); return /[A-Z]/.test(c) ? c : '#'; };
const buzz = () => { try { navigator.vibrate && navigator.vibrate(15); } catch (e) {} };

const svg = (p, o = {}) => `<svg viewBox="0 0 24 24" width="${o.s || 22}" height="${o.s || 22}" fill="none" stroke="currentColor" stroke-width="${o.w || 2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON = {
  check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', { s: 20, w: 3.2 }),
  edit: svg('<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>'),
  trash: svg('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'),
  search: svg('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>'),
  close: svg('<path d="M6 6l12 12M18 6L6 18"/>', { s: 20 }),
  lock: svg('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>'),
  unlock: svg('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 017.5-1.5"/>'),
  dots: svg('<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>'),
  list: svg('<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>', { s: 26 }),
  down: svg('<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>'),
  sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>'),
  help: svg('<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-.9.6-1.5 1.1-1.5 2.2M12 17h.01"/>'),
  file: svg('<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/>', { s: 18 })
};

/* ================= state ================= */
let state = { title: '', guests: [], theme: 'dark' };
const ui = { q: '', letter: '', status: 'all' };
let editing = false, idleT = 0, toastT = 0;

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (s && Array.isArray(s.guests)) state = Object.assign(state, s);
  } catch (e) {}
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { toast('Não foi possível salvar no aparelho. Verifique o espaço de armazenamento.'); }
}

/* ================= elements ================= */
const $list = $('#list'), $scroller = $('#scroller'), $alpha = $('#alpha'), $q = $('#q'), $qClear = $('#qClear');
const $toast = $('#toast'), $editBtn = $('#editBtn'), $editbar = $('#editbar');

/* ================= rendering ================= */
const metaText = g => g.checked ? 'Chegou às ' + hhmm(g.at || Date.now()) : 'Aguardando';

function rowHTML(g) {
  const on = g.checked ? ' on' : '';
  if (editing) {
    return `<div class="row edit${on}" data-id="${g.id}"><div class="nm">${esc(g.name)}<span class="meta">${metaText(g)}</span></div>` +
      `<button type="button" class="ibtn" data-act="edit" aria-label="Renomear ${esc(g.name)}">${ICON.edit}</button>` +
      `<button type="button" class="ibtn del" data-act="del" aria-label="Remover ${esc(g.name)}">${ICON.trash}</button></div>`;
  }
  return `<button type="button" class="row${on}" data-id="${g.id}" role="checkbox" aria-checked="${g.checked}">` +
    `<span class="nm">${esc(g.name)}<span class="meta">${metaText(g)}</span></span><span class="tick" aria-hidden="true">${ICON.check}</span></button>`;
}

function emptyHTML() {
  return `<div class="empty"><span class="empty-mark">${ICON.list}</span><h3>Nenhuma lista carregada</h3>` +
    `<p>Importe a lista de convidados (planilha .xlsx, .csv ou .txt) para começar o check-in.</p>` +
    `<div class="empty-actions"><button type="button" class="btn primary" data-empty="import">Importar lista</button>` +
    `<button type="button" class="btn ghost" data-empty="demo">Ver com lista de exemplo</button></div></div>`;
}

function visible() {
  const toks = norm(ui.q).split(' ').filter(Boolean);
  const arr = state.guests.map(g => ({ g, k: norm(g.name) }));
  arr.sort((a, b) => coll.compare(a.g.name, b.g.name));
  return arr.filter(({ g, k }) => {
    if (ui.status === 'present' && !g.checked) return false;
    if (ui.status === 'pending' && g.checked) return false;
    if (ui.letter && letterOf(k) !== ui.letter) return false;
    if (toks.length === 1 && toks[0].length === 1) return k.startsWith(toks[0]);
    return toks.every(t => k.includes(t));
  });
}

function render() {
  const items = visible();
  if (!state.guests.length) {
    $list.innerHTML = emptyHTML();
  } else if (!items.length) {
    $list.innerHTML = `<div class="empty"><p>Nenhum convidado encontrado${ui.q ? ` para “<b>${esc(ui.q)}</b>”` : ''}.</p></div>`;
  } else {
    const buckets = new Map();
    for (const { g, k } of items) {
      const L = letterOf(k);
      if (!buckets.has(L)) buckets.set(L, []);
      buckets.get(L).push(g);
    }
    const order = [...'ABCDEFGHIJKLMNOPQRSTUVWXYZ', '#'];
    let html = '';
    for (const L of order) {
      const gs = buckets.get(L);
      if (!gs) continue;
      const on = gs.filter(g => g.checked).length;
      html += `<section class="group" data-letter="${L}"><h2 class="letter">${L}<small>${on} de ${gs.length}</small></h2><div class="rows">${gs.map(rowHTML).join('')}</div></section>`;
    }
    $list.innerHTML = html;
  }
  renderAlpha();
  updateStats();
  $qClear.hidden = !ui.q;
}

function renderAlpha() {
  const have = new Set(state.guests.map(g => letterOf(norm(g.name))));
  const letters = [...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];
  if (have.has('#')) letters.push('#');
  const sl = $alpha.scrollLeft;
  $alpha.innerHTML = `<button type="button" class="chip wide" data-letter="" aria-pressed="${!ui.letter}">Todos</button>` +
    letters.map(L => `<button type="button" class="chip" data-letter="${L}" aria-pressed="${ui.letter === L}"${have.has(L) ? '' : ' disabled'}>${L}</button>`).join('');
  $alpha.scrollLeft = sl;
}

function updateStats() {
  const total = state.guests.length;
  const on = state.guests.filter(g => g.checked).length;
  const pct = total ? Math.round(on / total * 100) : 0;
  $('#nPresent').textContent = on;
  $('#nTotal').textContent = total;
  $('#pct').textContent = pct + '%';
  $('#barFill').style.width = pct + '%';
  $('#cAll').textContent = total;
  $('#cPresent').textContent = on;
  $('#cPending').textContent = total - on;
  const rec = state.guests.filter(g => g.checked && g.at).sort((a, b) => b.at - a.at).slice(0, 6);
  $('#recent').innerHTML = rec.length
    ? rec.map(g => `<li><span>${esc(g.name)}</span><time>${hhmm(g.at)}</time></li>`).join('')
    : '<li class="none">Nenhum check-in ainda.</li>';
}

function syncControls() {
  $q.value = ui.q;
  document.querySelectorAll('#seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.status === ui.status)));
}

function renderTitle() {
  $('#title').textContent = state.title || 'Nome do evento';

/* ================= check-in ================= */
function paintRow(g) {
  const el = $list.querySelector(`.row[data-id="${g.id}"]`);
  if (!el) return false;
  el.classList.toggle('on', g.checked);
  el.setAttribute('aria-checked', String(g.checked));
  el.querySelector('.meta').textContent = metaText(g);
  const grp = el.closest('.group');
  grp.querySelector('.letter small').textContent = `${grp.querySelectorAll('.row.on').length} de ${grp.querySelectorAll('.row').length}`;
  return true;
}

function toggle(id) {
  const g = state.guests.find(x => x.id === id);
  if (!g) return;
  const prev = { c: g.checked, at: g.at };
  g.checked = !g.checked;
  g.at = g.checked ? Date.now() : null;
  save();
  if (ui.status === 'all' && paintRow(g)) updateStats(); else render();
  buzz();
  toast(g.checked ? `${g.name} · presença confirmada` : `${g.name} · presença removida`, {
    undo() { g.checked = prev.c; g.at = prev.at; save(); render(); }
  });
}

/* ================= toast ================= */
function toast(msg, o = {}) {
  clearTimeout(toastT);
  $toast.innerHTML = `<span>${esc(msg)}</span>` + (o.undo ? '<button type="button" class="btn ghost sm" id="undoBtn">Desfazer</button>' : '');
  $toast.classList.add('show');
  if (o.undo) $('#undoBtn').onclick = () => { o.undo(); hideToast(); };
  toastT = setTimeout(hideToast, o.ms || 5000);
}
function hideToast() { $toast.classList.remove('show'); }

/* ================= modal ================= */
const $dlg = $('#dlg'), $dForm = $('#dlgForm'), $dBody = $('#dlgBody'), $dErr = $('#dlgErr'), $dOk = $('#dlgOk'), $dCancel = $('#dlgCancel');

function modal(o) {
  return new Promise(resolve => {
    $('#dlgTitle').textContent = o.title || '';
    $('#dlgMsg').textContent = o.message || '';
    $('#dlgMsg').hidden = !o.message;
    $dBody.innerHTML = o.html || '';
    $dErr.hidden = true; $dErr.textContent = '';
    $dOk.textContent = o.confirm || 'OK';
    $dOk.className = 'btn ' + (o.danger ? 'danger-solid' : 'primary');
    $dCancel.textContent = o.cancel || 'Cancelar';
    $dCancel.hidden = o.cancel === null;
    const finish = v => { if ($dlg.open) $dlg.close(); resolve(v); };
    $dForm.onsubmit = e => {
      e.preventDefault();
      const val = o.collect ? o.collect($dBody) : true;
      const err = o.validate && o.validate(val);
      if (err) { $dErr.textContent = err; $dErr.hidden = false; return; }
      finish(val);
    };
    $dCancel.onclick = () => finish(null);
    $dlg.oncancel = e => { e.preventDefault(); finish(null); };
    let downOnBackdrop = false;
    $dlg.onpointerdown = e => { downOnBackdrop = e.target === $dlg; };
    $dlg.onclick = e => { if (e.target === $dlg && downOnBackdrop) finish(null); };
    $dlg.showModal();
    if (o.onOpen) o.onOpen($dBody);
    const first = $dBody.querySelector('input:not([type=file]):not([type=radio]),textarea');
    (first || ($dCancel.hidden ? $dOk : $dCancel)).focus();
  });
}
const field = (id, label, val = '', ph = '') =>
  `<label class="fld"><span>${esc(label)}</span><input id="f_${id}" type="text" value="${esc(val)}" placeholder="${esc(ph)}" autocomplete="off" autocapitalize="words" maxlength="120"></label>`;
const cleanName = s => s.replace(/\s+/g, ' ').trim();

/* ================= edit mode ================= */
const bump = () => {
  if (!editing) return;
  clearTimeout(idleT);
  idleT = setTimeout(() => setEditing(false, true), EDIT_TIMEOUT);
};
['pointerdown', 'keydown', 'input'].forEach(ev => document.addEventListener(ev, bump, true));

function setEditing(v, auto) {
  editing = v;
  clearTimeout(idleT);
  document.body.classList.toggle('editing', v);
  $editbar.hidden = !v;
  $editBtn.innerHTML = (v ? ICON.unlock : ICON.lock) + `<span>${v ? 'Bloquear' : 'Editar'}</span>`;
  $editBtn.setAttribute('aria-label', v ? 'Bloquear a lista' : 'Editar a lista');
  $editBtn.setAttribute('aria-pressed', String(v));
  if (v) bump();
  if (auto && $dlg.open) $dCancel.click();
  render();
  if (auto) toast('Edição bloqueada por inatividade.');
}

/* ================= import / export ================= */
function parseNames(text) {
  const out = [];
  String(text).split(/\r?\n/).forEach(raw => {
    let s = raw.split(/[;\t]/)[0];
    s = s.replace(/^﻿/, '').replace(/^\s*["']|["']\s*$/g, '').replace(/^\s*\d+\s*[.)\-–]\s+/, '').replace(/\s+/g, ' ').trim();
    if (!s) return;
    if (!out.length && /^(nome|nomes|convidado|convidados|name|names|lista)$/.test(norm(s))) return;
    out.push(s);
  });
  return out;
}

function decode(buf) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch (e) { return new TextDecoder('windows-1252').decode(buf); }
}


/* ---- leitor mínimo de .xlsx (sem bibliotecas; funciona offline) ---- */
async function readXlsx(buf) {
  const bad = () => new Error('Não foi possível ler essa planilha. No Excel, use Salvar como → CSV e tente de novo.');
  if (typeof DecompressionStream === 'undefined') throw new Error('Este aparelho não abre .xlsx. Salve a planilha como .csv e tente de novo.');
  const u8 = new Uint8Array(buf), dv = new DataView(buf), td = new TextDecoder();
  let e = u8.length - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw bad();
  const n = dv.getUint16(e + 10, true);
  let p = dv.getUint32(e + 16, true);
  const files = {};
  for (let i = 0; i < n && dv.getUint32(p, true) === 0x02014b50; i++) {
    const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    files[td.decode(u8.subarray(p + 46, p + 46 + nl))] = { m: dv.getUint16(p + 10, true), size: dv.getUint32(p + 20, true), off: dv.getUint32(p + 42, true) };
    p += 46 + nl + el + cl;
  }
  const get = async name => {
    const f = files[name]; if (!f) return null;
    const start = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
    const data = u8.subarray(start, start + f.size);
    if (f.m === 0) return td.decode(data);
    return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  };
  const xml = t => new DOMParser().parseFromString(t, 'application/xml');
  try {
    // qual é a primeira aba
    let sheetPath = null;
    const wbT = await get('xl/workbook.xml'), relT = await get('xl/_rels/workbook.xml.rels');
    if (wbT && relT) {
      const sh = xml(wbT).querySelector('sheet');
      const rid = sh && (sh.getAttribute('r:id') || sh.getAttribute('id'));
      const rel = [...xml(relT).querySelectorAll('Relationship')].find(r => r.getAttribute('Id') === rid);
      if (rel) { const t = rel.getAttribute('Target'); sheetPath = t.startsWith('/') ? t.slice(1) : 'xl/' + t; }
    }
    if (!sheetPath || !files[sheetPath]) sheetPath = Object.keys(files).filter(k => /^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort()[0];
    const sheetT = sheetPath && await get(sheetPath);
    if (!sheetT) throw bad();
    // textos compartilhados
    const ssT = await get('xl/sharedStrings.xml');
    const shared = ssT ? [...xml(ssT).querySelectorAll('si')].map(si => [...si.querySelectorAll('t')].filter(t => !t.closest('rPh')).map(t => t.textContent).join('')) : [];
    // células → linhas
    const col = ref => { let c = 0; for (const ch of ref.replace(/[^A-Z]/gi, '').toUpperCase()) c = c * 26 + ch.charCodeAt(0) - 64; return c - 1; };
    const rows = [];
    xml(sheetT).querySelectorAll('row').forEach(r => {
      const line = []; let next = 0;
      r.querySelectorAll('c').forEach(c => {
        const ref = c.getAttribute('r'), i = ref ? col(ref) : next; next = i + 1;
        const t = c.getAttribute('t'), v = c.querySelector('v');
        let val = '';
        if (t === 's') val = shared[+(v && v.textContent)] || '';
        else if (t === 'inlineStr') val = [...c.querySelectorAll('t')].map(x => x.textContent).join('');
        else if (v) val = v.textContent;
        line[i] = String(val).replace(/\s+/g, ' ').trim();
      });
      rows.push(line);
    });
    // coluna dos nomes: a que tem cabeçalho "Nome/Convidado", senão a primeira com conteúdo
    const isHead = x => /^(nome|nomes|convidado|convidados|name|names)\b/.test(norm(x || ''));
    let c = -1, start = 0;
    for (let i = 0; i < Math.min(rows.length, 5) && c < 0; i++) {
      const j = (rows[i] || []).findIndex(isHead);
      if (j >= 0) { c = j; start = i + 1; }
    }
    if (c < 0) {
      c = 0;
      for (const r of rows) { const j = (r || []).findIndex(x => x); if (j >= 0) { c = j; break; } }
    }
    const names = rows.slice(start).map(r => (r && r[c]) || '').filter(Boolean);
    if (!names.length) throw new Error('Nenhum nome encontrado na planilha. Os nomes devem estar em uma coluna (de preferência com o título “Nome”).');
    return names;
  } catch (err) {
    throw err && err.message && !/XML|undefined|null/.test(err.message) ? err : bad();
  }
}

async function importList() {
  const res = await modal({
    title: 'Importar lista', message: 'Cole os nomes (um por linha) ou escolha uma planilha (.xlsx, .csv) ou .txt. Na planilha, uso a coluna “Nome” (ou a primeira coluna).', confirm: 'Importar',
    html: `<label class="fld"><span>Nomes</span><textarea id="f_text" rows="7" placeholder="Ana Beatriz Souza&#10;Bruno Lima&#10;Carla Mendes"></textarea></label>
      <div class="or">ou</div>
      <label class="filebtn">${ICON.file}<span>Escolher arquivo (.xlsx, .csv ou .txt)</span><input type="file" id="f_file" accept=".xlsx,.xls,.csv,.txt,text/plain,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></label>
      <fieldset class="radios"><legend style="display:none">Como importar</legend>
        <label><input type="radio" name="mode" value="add" checked><span>Adicionar à lista atual<small>Nomes repetidos são ignorados.</small></span></label>
        <label><input type="radio" name="mode" value="replace"><span>Substituir a lista<small>Mantém as presenças de quem continua na lista.</small></span></label>
      </fieldset>`,
    onOpen(root) {
      root.querySelector('#f_file').addEventListener('change', async e => {
        const f = e.target.files[0]; if (!f) return;
        $dErr.hidden = true;
        let txt;
        try {
          if (/\.xlsx$/i.test(f.name)) txt = (await readXlsx(await f.arrayBuffer())).join('\n');
          else if (/\.xls$/i.test(f.name)) throw new Error('Arquivo .xls antigo não é suportado. No Excel, use Salvar como → .xlsx ou .csv.');
          else txt = decode(await f.arrayBuffer());
        } catch (err) {
          $dErr.textContent = err.message || 'Não foi possível ler o arquivo.'; $dErr.hidden = false; e.target.value = ''; return;
        }
        const ta = root.querySelector('#f_text');
        ta.value = (ta.value ? ta.value.replace(/\s+$/, '') + '\n' : '') + txt;
        root.querySelector('.filebtn span').textContent = f.name;
      });
    },
    collect: r => ({ text: r.querySelector('#f_text').value, mode: r.querySelector('input[name=mode]:checked').value }),
    validate: v => parseNames(v.text).length ? '' : 'Nenhum nome encontrado. Cole ou carregue uma lista.'
  });
  if (!res || !canEdit()) return;
  const names = parseNames(res.text);
  const snap = JSON.stringify(state.guests);
  const seen = new Set(res.mode === 'add' ? state.guests.map(g => norm(g.name)) : []);
  const unique = []; let dup = 0;
  for (const n of names) { const k = norm(n); if (seen.has(k)) { dup++; continue; } seen.add(k); unique.push(n); }
  if (res.mode === 'replace') {
    const old = new Map(state.guests.map(g => [norm(g.name), g]));
    state.guests = unique.map(n => { const o = old.get(norm(n)); return o ? Object.assign({}, o, { name: n }) : { id: uid(), name: n, checked: false, at: null }; });
  } else {
    state.guests.push(...unique.map(n => ({ id: uid(), name: n, checked: false, at: null })));
  }
  save(); ui.q = ''; ui.letter = ''; ui.status = 'all'; syncControls(); render();
  toast(`${unique.length} convidado(s) importado(s)` + (dup ? ` · ${dup} repetido(s) ignorado(s)` : ''), { undo() { state.guests = JSON.parse(snap); save(); render(); }, ms: 8000 });
}

async function exportCSV() {
  if (!state.guests.length) { toast('A lista está vazia.'); return; }
  const rows = [['Nome', 'Presente', 'Horário do check-in']];
  [...state.guests].sort((a, b) => coll.compare(a.name, b.name))
    .forEach(g => rows.push([g.name, g.checked ? 'Sim' : 'Não', g.at ? new Date(g.at).toLocaleString('pt-BR') : '']));
  const csv = '﻿' + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const name = `presencas-${new Date().toLocaleDateString('sv-SE')}.csv`;
  try {
    const C = window.Capacitor;
    if (C && C.isNativePlatform && C.isNativePlatform()) {
      const { Filesystem, Share } = C.Plugins;
      await Filesystem.writeFile({ path: name, data: csv, directory: 'CACHE', encoding: 'utf8' });
      const { uri } = await Filesystem.getUri({ path: name, directory: 'CACHE' });
      await Share.share({ title: 'Presenças', text: 'Lista de presenças', url: uri, dialogTitle: 'Exportar presenças' });
      return;
    }
  } catch (e) {
    if (/cancel/i.test(String((e && e.message) || e))) return;
  }
  try {
    if (navigator.canShare && navigator.share) {
      const f = new File([csv], name, { type: 'text/csv' });
      if (navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: 'Presenças' }); return; }
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ================= menu / help ================= */
const $menu = $('#menu');
function openMenu() {
  $('#menuList').innerHTML =
    `<button type="button" data-m="export">${ICON.down}<span>Exportar presenças (CSV)</span></button>` +
    `<button type="button" data-m="theme">${ICON.sun}<span>Tema ${state.theme === 'dark' ? 'claro' : 'escuro'}</span></button>` +
    `<button type="button" data-m="help">${ICON.help}<span>Como usar</span></button>`;
  $menu.showModal();
}
$menu.addEventListener('click', e => {
  const b = e.target.closest('[data-m]');
  if (e.target === $menu) { $menu.close(); return; }
  if (!b) return;
  $menu.close();
  if (b.dataset.m === 'export') exportCSV();
  if (b.dataset.m === 'theme') { state.theme = state.theme === 'dark' ? 'light' : 'dark'; save(); applyTheme(); }
  if (b.dataset.m === 'help') modal({
    title: 'Como usar', cancel: null, confirm: 'Entendi',
    html: `<ul class="help">
      <li><b>Confirmar presença:</b> toque no nome. Toque de novo para desfazer (ou use “Desfazer”).</li>
      <li><b>Buscar:</b> digite o nome, ou só a primeira letra. Também dá para usar as letras A–Z.</li>
      <li><b>Editar a lista:</b> toque em Editar e confirme. A edição bloqueia sozinha após 3 minutos sem uso.</li>
      <li><b>Dados:</b> ficam salvos neste aparelho e funcionam sem internet. Use “Exportar” para guardar uma cópia.</li></ul>`
  });
});

/* ================= events ================= */
$list.addEventListener('click', e => {
  const empty = e.target.closest('[data-empty]');
  if (empty) { empty.dataset.empty === 'import' ? importList() : loadDemo(); return; }
  const row = e.target.closest('.row[data-id]'); if (!row) return;
  const id = row.dataset.id;
  if (editing) {
    const act = e.target.closest('[data-act]');
    if (!act) return;
    act.dataset.act === 'edit' ? renameGuest(id) : deleteGuest(id);
    return;
  }
  toggle(id);
});

$alpha.addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c || c.disabled) return;
  ui.letter = c.dataset.letter; ui.q = ''; syncControls(); render(); $scroller.scrollTop = 0;
});
$('#seg').addEventListener('click', e => {
  const b = e.target.closest('button[data-status]'); if (!b) return;
  ui.status = b.dataset.status; syncControls(); render(); $scroller.scrollTop = 0;
});
$q.addEventListener('input', () => { ui.q = $q.value; if (ui.q) ui.letter = ''; render(); $scroller.scrollTop = 0; });
$q.addEventListener('keydown', e => {
  if (e.key === 'Enter') $q.blur();
  if (e.key === 'Escape') { ui.q = ''; syncControls(); render(); }
});
$qClear.addEventListener('click', () => { ui.q = ''; syncControls(); render(); $q.focus(); });
$editBtn.addEventListener('click', askEdit);
$('#doneEdit').addEventListener('click', () => setEditing(false));
$('#menuBtn').addEventListener('click', openMenu);
$editbar.addEventListener('click', e => {
  const t = e.target.closest('[data-tool]'); if (!t) return;
  ({ add: addGuest, import: importList, title: editTitle, reset: resetChecks, wipe: wipeList })[t.dataset.tool]();
});

/* ================= init ================= */
load();
applyTheme();
renderTitle();
$('#menuBtn').innerHTML = ICON.dots;
$('#searchIcon').innerHTML = ICON.search;
$qClear.innerHTML = ICON.close;
$('#today').textContent = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
setEditing(false);
if (matchMedia('(hover:hover) and (pointer:fine)').matches) $q.focus();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
